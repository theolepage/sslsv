encoder:
  type: 'resnet34'
method:
  type: 'simclr_margins'
  loss:
    loss: 'nt-xent-cosface'
    scale: 33.3333333333
    margin: 0.2
  enable_projector: false
  ssps:
    start_epoch: 100
    verbose: true
    sampling: 'kmeans-repr'
    kmeans_nb_prototypes: 25000
    inter_sampling_size: 1
    pos_queue_size: 1092009
trainer:
  last_checkpoint: 'models/ssps/voxceleb2/simclr/_simclr/checkpoints/model_latest_ssps-1M.pt'
  epochs: 110
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  ssps: true
  train: 'voxceleb2_train.csv'
  augmentation:
    enable: true
