cudnn_benchmark: false  # cuDNN's algorithm search allocated oversized workspaces on resume
# Ablation 9, on top of _8. Reverts #16 by swapping SDPN's masking for sslsv's own:
# `sdpn_spec_aug` off, `spec_aug` on. The two differ in more than provenance --
#   SDPN  : one band per *sample*, erased from both of its local rows, widths
#           randint(0,10) frames / randint(0,6) mels, applied before the pair is split.
#   sslsv : an independent band per *view*, widths up to spec_aug_max_time 5 /
#           spec_aug_max_freq 3, applied in BaseEncoder and gated on a 2s input so it
#           only ever touches the local views.
# Both fire on 20% of their unit. sslsv's is only reachable because _8 handed the Mel
# back to the encoder.
encoder:
  type: 'ecapatdnn'
  channels: [1024, 1024, 1024, 1024, 3072]
  mel_n_mels: 80
  spec_aug: true                  # (#16) sslsv's masking instead of SDPN's
method:
  type: 'dinosk'
trainer:
  epochs: 150
  batch_size: 256                 # (#2)  REVERTED: sslsv's batch size
  optimizer: 'sgd'
  learning_rate: 0.4              # (#2)  REVERTED: unscaled
  learning_rate_sched: 'warmup+cosine'
  weight_decay: 0.00005
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  frame_length: 64000
  frame_sampling: 'dinosk'
  ssl_dino_global_count: 1
  ssl_dino_local_count: 4
  ssl_dino_local_pairs: true      # kept: packing only, so nothing is padded to -100
  train: 'voxceleb1_train.csv'
  augmentation:
    enable: true
    strategy: 'all'
