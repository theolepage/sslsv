cudnn_benchmark: false  # cuDNN's algorithm search allocated oversized workspaces on resume
# Ablation 7, on top of _6. Reverts #2: back to sslsv's batch 256 and lr 0.4, dropping
# SDPN's linear scaling of the learning rate with the batch. This also restores the
# memory headroom that bs 384 consumed.
encoder:
  type: 'ecapatdnn'
  channels: [1024, 1024, 1024, 1024, 3072]
  mel_n_mels: 80
  extract_mel_features: false     # (#10) the method owns the Mel transform
method:
  type: 'dinosk'
  sdpn_views: true                    # (#10) pairs Mel-transformed then split in half
  sdpn_spec_aug: true                 # (#16) erasing on local views, active in exp/sdpn
trainer:
  epochs: 150
  batch_size: 256                 # (#2)  REVERTED: sslsv's batch size
  optimizer: 'sgd'
  learning_rate: 0.4              # (#2)  REVERTED: unscaled
  learning_rate_sched: 'warmup+cosine'
  weight_decay: 0.00005
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  frame_length: 64000
  frame_sampling: 'dinosk'
  ssl_dino_global_count: 1
  ssl_dino_local_count: 4
  ssl_dino_local_pairs: true      # (#10) also removes the -100 padding (OOM at bs 384)
  train: 'voxceleb1_train.csv'
  augmentation:
    enable: true
    strategy: 'all'
