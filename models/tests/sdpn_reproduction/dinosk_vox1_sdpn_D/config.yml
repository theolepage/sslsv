cudnn_benchmark: false  # cuDNN's algorithm search allocated oversized workspaces on resume
# dinop_sdpn_D on VoxCeleb1, to pair with dinop_vox1_sdpn.
# Ablation D of dinop_sdpn: the method block reverted to sslsv's own behaviour.
# Reverts #3 shared prototypes, #4 summed prototype gradients, #12 GELU, #13 SDPN head
# init and #14 prototypes exempt from weight decay -- so the student holds its own
# prototype bank and the teacher an EMA copy, as sslsv did originally.
# Also reverts #11 per-parameter gradient clipping, which belongs with the method
# changes rather than with the learning-rate arms it was first grouped under.
# `sdpn_views` stays: it lives under `method:` but is a front-end change (block E).
# Runs the full 150 epochs, unlike the vox2 version: an epoch here is ~9 min rather
# than ~65, so the 20-epoch screening cap that vox2 needed is no longer worth the loss
# of comparability against dinop_vox1_sdpn. Add `stop_at_epoch: 20` back to screen.
encoder:
  type: 'ecapatdnn'
  channels: [1024, 1024, 1024, 1024, 3072]
  mel_n_mels: 80
  mel_win_fn: 'hann'              # (#9)  torchaudio default, sslsv used hamming
  waveform_scale: 32768.0         # (#6)  train in the int16 domain (SDPN reads wavs
                                  #       with scipy, so the 1e-6 log floor is inert)
  extract_mel_features: false     # (#10) the method owns the Mel transform
method:
  type: 'dinosk'
  shared_prototypes: false            # (#3)  REVERTED: student bank + EMA copy
  prototypes_grad_world_size_sum: false  # (#4) REVERTED: DDP-averaged gradients
  head_activation: 'relu'             # (#12) REVERTED
  sdpn_init: false                    # (#13) REVERTED: PyTorch default init
  prototypes_weight_decay: true       # (#14) REVERTED: prototypes are regularized
  sdpn_views: true                    # (#10) pairs Mel-transformed then split in half
  clip_grad: 0.0                      # (#11) REVERTED: no gradient clipping
  sdpn_spec_aug: true                 # (#16) erasing on local views, active in exp/sdpn
trainer:
  epochs: 150
  batch_size: 384                 # (#2)  96 per GPU x 4 GPUs
  optimizer: 'sgd'
  learning_rate: 0.6              # (#2)  0.4 * 384 / 256
  learning_rate_sched: 'warmup+cosine'
  weight_decay: 0.00005
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  frame_length: 64000
  frame_sampling: 'dinosk'
  ssl_dino_global_count: 1
  ssl_dino_local_count: 4
  ssl_dino_local_pairs: true      # (#10) also removes the -100 padding (OOM at bs 384)
  train: 'voxceleb1_train.csv'
  augmentation:
    enable: true
    strategy: 'all'
    strategy_probs: [0.1667, 0.125, 0.375, 0.3333]  # (#7) SDPN's noise_random profile
    rir_file: 'rirs/rir.npy'      # (#8)  SDPN's fixed 1000-RIR bank
    rir_normalize: false          # (#8)  SDPN does not normalize RIR energy
    rir_gain: [-7, 3]             # (#8)  SDPN applies a random gain to the RIR
    snr_eps: 9.3132257e-14        # (#6)  1e-4 / 32768^2: SDPN computes SNR on int16
