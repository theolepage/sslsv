encoder:
  type: 'ecapatdnn'
  channels: [1024, 1024, 1024, 1024, 3072]
  mel_n_mels: 80
method:
  type: 'dinosk'
trainer:
  epochs: 150
  batch_size: 384
  optimizer: 'sgd'
  learning_rate: 0.6
  learning_rate_sched: 'warmup+cosine'
  weight_decay: 0.00005
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  frame_length: 64000
  frame_sampling: 'dinosk'
  ssl_dino_global_count: 1
  ssl_dino_local_count: 4
  train: 'voxceleb2_train.csv'
  augmentation:
    enable: true
    strategy: 'all'
