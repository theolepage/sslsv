encoder:
  type: 'ecapatdnn'
  channels: [1024, 1024, 1024, 1024, 3072]
  mel_n_mels: 80
method:
  type: 'dino_proto2'
  osps:
    start_epoch: 75
    nb_clusters: 5000
    memory_size: 4
    centroids_momentum: 0.9
    inter_sampling_size: 1
    coverage: 0.35
    metrics: true
    verbose: true
trainer:
  last_checkpoint: 'models/tests/dinop_vox1_h-proto2/checkpoints/model_epoch-70.pt'
  epochs: 150
  batch_size: 256
  optimizer: 'sgd'
  learning_rate: 0.4
  learning_rate_sched: 'warmup+cosine'
  weight_decay: 0.00005
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  frame_length: 64000
  frame_sampling: 'dino_proto'
  ssl_dino_global_count: 1
  ssl_dino_local_count: 4
  train: 'voxceleb1_train.csv'
  augmentation:
    enable: true
    strategy: 'all'
