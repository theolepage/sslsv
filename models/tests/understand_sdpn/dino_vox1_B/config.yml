encoder:
  type: 'ecapatdnn'
  channels: [1024, 1024, 1024, 1024, 3072]
  mel_n_mels: 80
method:
  type: 'dino'
  head_output_dim: 1024
trainer:
  epochs: 150
  batch_size: 256
  optimizer: 'sgd'
  learning_rate: 0.4
  learning_rate_sched: 'warmup+cosine'
  weight_decay: 0.00005
evaluation:
  validation:
    - type: 'sv_cosine'
  test:
    - type: 'sv_cosine'
      frame_length: null
dataset:
  ssl: true
  frame_length: 64000
  frame_sampling: 'dino'
  train: 'voxceleb1_train.csv'
  augmentation:
    enable: true
    strategy: 'all'
